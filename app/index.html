<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<meta name="description" content="Turn your photos and a caption into bold multi-panel GTA-style cover art, right in the browser.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="studio-shell">
  <aside class="panel-rail" aria-label="Cover controls">
    <h1>Vice Cover <span>Studio</span></h1>
    <p class="tagline">Your photos, a big caption, a Vice City glow — export a poster in seconds.</p>

    <div class="rail-group">
      <span>Photos</span>
      <label class="file-pick">Add photos
        <input id="pickFiles" type="file" accept="image/*" multiple>
      </label>
      <p class="hint">Each photo fills the first empty panel. Drag a panel to pan it, scroll to zoom, double-click to reset it.</p>
    </div>

    <div class="rail-group">
      <span>Layout — keys 1–4</span>
      <div class="chip-row" role="group" aria-label="Layout">
        <button type="button" class="chip chip-on" data-arrangement="hero">Hero</button>
        <button type="button" class="chip" data-arrangement="strip">Strip</button>
        <button type="button" class="chip" data-arrangement="grid">Grid</button>
        <button type="button" class="chip" data-arrangement="single">Single</button>
      </div>
    </div>

    <div class="rail-group">
      <span>Colour grade</span>
      <div class="chip-row" role="group" aria-label="Colour grade">
        <button type="button" class="chip chip-on" data-wash="sunset">Sunset</button>
        <button type="button" class="chip" data-wash="neon">Neon</button>
        <button type="button" class="chip" data-wash="vice">Vice</button>
        <button type="button" class="chip" data-wash="gold">Gold</button>
      </div>
    </div>

    <div class="rail-group">
      <span>Words</span>
      <label class="field">Headline
        <input id="headline" type="text" maxlength="40" value="Neon Bay" autocomplete="off">
      </label>
      <label class="field">Tagline
        <input id="tagline" type="text" maxlength="60" value="Vice City Nights" autocomplete="off">
      </label>
    </div>

    <div class="rail-group">
      <span>Export size</span>
      <div class="chip-row" role="group" aria-label="Export size">
        <button type="button" class="chip chip-on" data-size="wide">1920 × 1080</button>
        <button type="button" class="chip" data-size="portrait">1080 × 1350</button>
        <button type="button" class="chip" data-size="square">1080 × 1080</button>
      </div>
    </div>

    <div class="action-row">
      <button id="savePng" type="button" class="primary">Export PNG</button>
      <button id="resetFrame" type="button" class="ghost">Reset framing</button>
    </div>
    <p id="note" role="status"></p>
  </aside>

  <main class="stage-wrap">
    <canvas id="stage" width="1920" height="1080" aria-label="Cover preview — drag to pan a panel, scroll to zoom"></canvas>
  </main>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
